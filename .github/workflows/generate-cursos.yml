name: Generar sugerencias de cursos (IA, mensual)

on:
  schedule:
    # Día 1 de cada mes a las 8:00 UTC (9-10h en España según la época del año).
    - cron: "0 8 1 * *"
  workflow_dispatch: {}  # te deja lanzarlo a mano desde la pestaña "Actions" de GitHub

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install "setuptools<69" requests firebase-admin
      - name: Generar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: python generate_cursos.py