name: Sembrar catálogo de retos (una vez)

on:
  workflow_dispatch:
    inputs:
      borrar_catalogo_anterior:
        description: "Borrar los retos que ya había antes de sembrar los nuevos (si eliges 'no', los nuevos se añaden mezclados con los de antes)"
        required: false
        default: "no"
        type: choice
        options:
          - "no"
          - "si"

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install "setuptools<69" firebase-admin
      - name: Sembrar
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          BORRAR_CATALOGO_ANTERIOR: ${{ github.event.inputs.borrar_catalogo_anterior }}
        run: python seed_retos.py