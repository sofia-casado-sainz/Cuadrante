name: Sincronizar Canvas

on:
  schedule:
    # Cada hora. La hora es UTC (España va 1-2h por delante según la época del año).
    - cron: "17 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install "setuptools<69" requests firebase-admin pywebpush

      - name: Sincronizar
        env:
          CANVAS_DOMAIN: ${{ secrets.CANVAS_DOMAIN }}
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: python sync_canvas.py
