name: Sincronizar Blackboard (UAH)

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      debug_events:
        description: "Nº de eventos a volcar enteros en el log (0 = ninguno)"
        required: false
        default: "0"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install "setuptools<69" requests firebase-admin pywebpush icalendar
      - name: Sincronizar
        env:
          BLACKBOARD_ICS_URL: ${{ secrets.BLACKBOARD_ICS_URL }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          DEBUG_EVENTS: ${{ github.event.inputs.debug_events || '0' }}
        run: python sync_blackboard.py